name: Build movies.json

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write   # commit the IMDb-ID cache
  pages: write
  id-token: write

concurrency:
  group: build-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}movies.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s pipeline/tests

      - name: Build movies.json
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: python pipeline/build.py --out dist/movies.json

      - name: Commit IMDb-ID cache
        run: |
          if ! git diff --quiet -- pipeline/cache/imdb_ids.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pipeline/cache/imdb_ids.json
            git commit -m "Update IMDb ID cache [skip ci]"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
